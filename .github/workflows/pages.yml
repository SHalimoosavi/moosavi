name: Deploy static portfolio to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static site
        shell: bash
        run: |
          test -f index.html
          test -f 404.html
          test -f robots.txt
          test -f sitemap.xml
          test -f assets/css/styles.css
          test -f assets/js/app.js
          project_count="$(find projects -maxdepth 1 -type f -name '*.html' | wc -l)"
          test "$project_count" -eq 16
          echo "Project page count: $project_count"
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".").resolve()
          pages_base = "/moosavi/"

          html = [
              root / "index.html",
              root / "404.html",
              *sorted((root / "projects").glob("*.html")),
          ]

          for f in html:
              s = f.read_text(encoding="utf-8")

              for href in re.findall(r'href=["\']([^"\']+)["\']', s):
                  if href.startswith((
                      "http://",
                      "https://",
                      "#",
                      "mailto:",
                      "javascript:",
                  )):
                      continue

                  clean = href.split("#", 1)[0]

                  if not clean:
                      continue

                  # GitHub Pages site-root URL.
                  if clean.startswith(pages_base):
                      relative = clean[len(pages_base):]
                      target = (root / relative).resolve()
                  elif clean.startswith("/"):
                      # Other absolute URLs are external/site-root routes.
                      continue
                  else:
                      target = (f.parent / clean).resolve()

                  if not target.exists():
                      raise SystemExit(
                          f"Broken local link: {f} -> {href}"
                      )

          print("Static link integrity: OK")
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
